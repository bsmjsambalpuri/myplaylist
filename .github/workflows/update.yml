name: Update IPTV Playlist

on:
schedule:
  # Runs every 12 hours (at 00:00 and 12:00 UTC)
  - cron: '0 */12 * * *'
workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows GitHub actions to commit changes back to your repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Filter Script
      run: python process_playlist.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add custom_playlist.m3u
        # Commit only if changes exist to avoid empty commit errors
        git diff-index --quiet HEAD || git commit -m "Automated Playlist Update"
        git push