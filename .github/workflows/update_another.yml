name: Update Another Full Playlist

on:
  schedule:
    # Runs every single day at exactly 12:02 AM UTC
    #- cron: '2 0 * * *'
  workflow_dispatch: # Keeps manual trigger available

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Full Unfiltered Playlist Script
      run: python process_all_playlist.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add another_playlist.m3u
        git diff-index --quiet HEAD || git commit -m "Automated Full Playlist Update"
        git push